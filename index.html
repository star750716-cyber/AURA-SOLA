    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- 自定義動畫樣式 & 商業模式頁面樣式 -->
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; } /* 全局字體更新以配合新頁面 */
        .font-sans { font-family: 'Noto Sans TC', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
        
        /* 簡單的進場動畫 */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .animate-fade-in { animation: fadeIn 0.8s ease-out forwards; }
        .animate-fade-in-up { animation: fadeInUp 0.8s ease-out forwards; }
        .animate-slide-in-left { animation: slideInLeft 0.8s ease-out forwards; }
        .animate-slide-in-right { animation: slideInRight 0.8s ease-out forwards; }

        /* --- 商業模式頁面特定樣式 (直接移植) --- */
        .scene {
            perspective: 1000px;
            cursor: pointer;
            height: 400px; /* Default height */
        }

        .card {
            width: 100%;
            height: 100%;
            transition: transform 0.8s;
            transform-style: preserve-3d;
            position: relative;
        }

        /* 翻轉狀態 class */
        .card.is-flipped {
            transform: rotateY(180deg);
        }

        .card__face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden; /* Safari */
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .card__face--front {
            background: white;
            z-index: 2;
            border: 1px solid #e7e5e4;
        }

        .card__face--back {
            background: #292524; /* stone-800 */
            color: #f5f5f4;
            transform: rotateY(180deg);
            padding: 2rem;
            border: 1px solid #1c1917;
        }
        
        /* B2C 背面特別色 */
        .b2c-back {
            background: #57534e; /* stone-600 */
        }

        /* --- 九宮格 Grid 佈局 --- */
        .bmc-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: auto auto; /* 自動高度 */
            gap: 1rem;
        }
        
        /* 手機版適配 */
        @media (max-width: 1024px) {
            .bmc-grid {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
            }
            .scene {
                height: 450px;
            }
        }

        /* 電腦版 Grid 定位 (5欄佈局) */
        @media (min-width: 1025px) {
            /* 第一列：上層邏輯 */
            .kp { grid-column: 1 / 2; grid-row: 1 / 2; }
            
            .ka-kr-col { grid-column: 2 / 3; grid-row: 1 / 2; display: flex; flex-direction: column; gap: 1rem; }
            .ka { flex: 1; }
            .kr { flex: 1; }
            
            .vp { grid-column: 3 / 4; grid-row: 1 / 2; }
            
            .cr-ch-col { grid-column: 4 / 5; grid-row: 1 / 2; display: flex; flex-direction: column; gap: 1rem; }
            .cr { flex: 1; }
            .ch { flex: 1; }
            
            .cs { grid-column: 5 / 6; grid-row: 1 / 2; }
            
            /* 第二列：財務邏輯 (Cost & Revenue) */
            .cost { grid-column: 1 / 3; grid-row: 2 / 3; }
            .rev { grid-column: 3 / 6; grid-row: 2 / 3; }
        }

        .bmc-box {
            background: white;
            padding: 1.5rem;
            border-radius: 0.25rem;
            border: 1px solid #e7e5e4;
            transition: all 0.3s ease;
            height: 100%;
        }

        .bmc-box:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-color: #a8a29e;
        }

        .bmc-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #78716c;
            font-weight: 700;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .bmc-content ul {
            list-style-type: none;
            padding: 0;
        }
        
        .bmc-content li {
            position: relative;
            padding-left: 1rem;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #44403c;
            border-left: 2px solid #f5f5f4;
        }
        
        /* 重點強調樣式 */
        .highlight-box {
            background-color: #fafaf9;
            border: 1px solid #d6d3d1;
        }
        .highlight-box .bmc-title {
            color: #1c1917;
        }
    </style>
